name: Release
on:
  push:
    tags:
      - 'v*'
permissions:
  contents: write
jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Build deploy + installer ZIPs
        shell: pwsh
        run: ./scripts/build-deploy.ps1 -CreateInstaller
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            releases/SPUDS-IMS-Deploy-*.zip
            releases/SPUDS-IMS-Installer-*.zip
          generate_release_notes: true
